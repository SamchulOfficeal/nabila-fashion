<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/auravelle-mark.svg" />
  <link rel="apple-touch-icon" href="/auravelle-mark.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E91E63" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NABILA FASHION" />
  <meta
    name="description"
    content="NABILA FASHION — a premium women's fashion boutique. Handloom sarees, three piece sets, abayas, gowns and accessories with cash on delivery across Bangladesh."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
  <title>NABILA FASHION — Premium Women's Fashion Boutique</title>
</head>


<body>
  <div id="root"></div>
  <!-- Paint the brand colour instantly (no white flash before JS boots) and
       apply the saved theme before first paint to avoid dark-mode flicker. -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("nabila:theme");
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (theme === "dark") document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
